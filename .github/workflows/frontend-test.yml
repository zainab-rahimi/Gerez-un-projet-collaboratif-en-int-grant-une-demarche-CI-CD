name: Frontend test

on:
  pull_request:
    branches: main

  jobs:
    test:
      runs-on: ubuntu-latest

      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Set up Front end Angular
          uses: actions/setup-node@v4
          with:
            node-version: '20.x'
            name: Run test Angular
            run: npm test
            working-directory: ./front




